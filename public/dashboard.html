<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Admin Dashboard | Your Store
</title>

<link
rel="stylesheet"
href="../css/style.css"
>

</head>


<body>


<header class="header">

<div class="container header-container">

<h2>
Admin Dashboard
</h2>

<button
class="btn"
onclick="logout()"
>
Logout
</button>

</div>

</header>


<main>

<section class="products-section">

<div class="container">


<!-- PRODUCT UPLOAD -->

<h1>
Upload Product
</h1>


<form
id="productForm"
enctype="multipart/form-data"
>


<label>
Product Name
</label>

<input
type="text"
name="name"
required
placeholder="Product name"
>


<label>
Category
</label>

<select
name="category"
required
>

<option value="">
Select Category
</option>

<option value="Mobile">
Mobile
</option>

<option value="Mobile Accessories">
Mobile Accessories
</option>

<option value="Clothing">
Clothing
</option>

<option value="Shoe">
Shoe
</option>

<option value="Watch">
Watch
</option>

<option value="Sun Glass">
Sun Glass
</option>

<option value="Perfume">
Perfume
</option>

<option value="Ladies Beauty Product">
Ladies Beauty Product
</option>

<option value="Food Item">
Food Item
</option>

</select>


<label>
Price
</label>

<input
type="number"
name="price"
required
min="0"
step="0.01"
>


<label>
Old Price
</label>

<input
type="number"
name="old_price"
min="0"
step="0.01"
>


<label>
Stock
</label>

<input
type="number"
name="stock"
min="0"
>


<label>
Description
</label>

<textarea
name="description"
rows="5"
></textarea>


<label>
Product Image
</label>

<input
type="file"
name="image"
accept="image/*"
>


<button
class="btn"
type="submit"
>

Upload Product

</button>


</form>


<p id="productMessage"></p>


<hr>


<!-- PRODUCT LIST -->

<h2>
Products
</h2>


<div
id="productList"
>

Loading...

</div>


<hr>


<!-- ORDERS -->

<h2>
Orders
</h2>


<div
id="orderList"
>

Loading...

</div>


</div>

</section>

</main>


<script src="../js/admin.js"></script>

</body>

</html>
