<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mobile | Your Store</title>

    <meta name="description"
          content="Shop mobile phones online at Your Store.">

    <link rel="stylesheet"
          href="../style.css">

</head>


<body data-category="Mobile">


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="container header-container">

        <div class="logo">

            <a href="../index.html">
                Your Store
            </a>

        </div>


        <nav class="navbar">

            <a href="../index.html">
                Home
            </a>

            <a href="mobile.html">
                Mobile
            </a>

            <a href="mobile-accessories.html">
                Accessories
            </a>

            <a href="clothing.html">
                Clothing
            </a>

            <a href="shoe.html">

            </a>

            <a href="watch.html">

            <a href="../contact.html">
                Contact
            </a>

                Cart (<span id="cartCount">0</span>)
            </a>

        </nav>

    </div>

</header>


<!-- ================= MOBILE PRODUCTS ================= -->

<section class="products-section">

    <div class="container">

        <div class="section-header">

            <h1>Mobile</h1>

            <div class="filter-area">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search mobile..."
                >

                <select id="sortProducts">

                    <option value="default">
                        Sort Products
                    </option>

                    <option value="low">
                        Price Low to High
                    </option>

                    <option value="high">
                        Price High to Low
                    </option>

                </select>

            </div>

        </div>


        <div
            class="product-grid"
            id="categoryProducts"
        >

            <p>Loading products...</p>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container">

        <div class="copyright">

            <p>
                © 2026 Your Store. All Rights Reserved.
            </p>

        </div>

    </div>

</footer>
