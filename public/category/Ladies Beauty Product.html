<section class="products-section">

    <div class="container">

        <div class="section-header">

            <h1>Ladies Beauty Products</h1>

            <div class="filter-area">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search beauty products..."
                >

                <select id="sortProducts">

                    <option value="default">
                        Sort Products
                    </option>

                    <option value="low">
                        Price Low to High
                    </option>

                    <option value="high">
                        Price High to Low
                    </option>

                </select>

            </div>

        </div>


        <!-- Products will come from database -->

        <div
            class="product-grid"
            id="categoryProducts"
        >

            <p>
                Loading products...
            </p>

        </div>

    </div>

</section>
