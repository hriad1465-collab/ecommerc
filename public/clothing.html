<section class="products-section">

<div class="container">

<h1>Clothing</h1>

<div class="filter-area">

<input
type="search"
id="searchInput"
placeholder="Search clothing..."
>

<select id="sortProducts">

<option value="default">
Sort Products
</option>

<option value="low">
Price Low to High
</option>

<option value="high">
Price High to Low
</option>

</select>

</div>


<div
class="product-grid"
id="productContainer"
>

<div
class="product-card"
data-name="Premium T Shirt"
data-price="850"
>

<img
src="../images/tshirt.jpg"
alt="Premium T Shirt"
loading="lazy"
>

<div class="product-info">

<h3>
Premium T Shirt
</h3>

<p class="category">
Clothing
</p>

<p class="price">
৳850
</p>

<button
class="btn add-cart"
data-id="301"
data-name="Premium T Shirt"
data-price="850"
data-image="../images/tshirt.jpg"
>
Add To Cart
</button>

</div>

</div>


<div
class="product-card"
data-name="Mens Shirt"
data-price="1500"
>

<img
src="../images/shirt.jpg"
alt="Mens Shirt"
loading="lazy"
>

<div class="product-info">

<h3>
Mens Shirt
</h3>

<p class="category">
Clothing
</p>

<p class="price">
৳1,500
</p>

<button
class="btn add-cart"
data-id="302"
data-name="Mens Shirt"
data-price="1500"
data-image="../images/shirt.jpg"
>
Add To Cart
</button>

</div>

</div>

</div>

</div>

</section>
